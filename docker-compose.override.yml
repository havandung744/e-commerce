 version: '3.4'

 services:
    catalogdb:
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=123456
        - POSTGRES_DB=CatalogDb
      restart: always
      ports:
        - "15432:5432"
      volumes:
        - postgres_catalog:/var/lib/postgresql